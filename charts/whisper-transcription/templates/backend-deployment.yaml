{{- if eq .Values.backend.include true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-backend-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-backend
  template:
    metadata:
      labels:
        app: whisper-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper-backend
          image: "{{ .Values.backend.image.name }}:{{ .Values.backend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: {{ .Values.backend.gpus }}
              cpu: "4"
              memory: "10Gi"
            limits:
              nvidia.com/gpu: {{ .Values.backend.gpus }}
              cpu: "8"
              memory: "40Gi"
          imagePullPolicy: Always
          env:
            - name: HTTP_PROXY
              value: {{ .Values.backend.proxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.backend.proxy }}
            - name: NO_PROXY
              value: {{ .Values.backend.no_proxy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /home/appuser/app/models
            - name: cache
              mountPath: /home/appuser/.cache
      volumes:
        # Sized for up to 10 concurrent requests, each holding a 1GB upload
        # (app.py's MAX_REQUEST_SIZE) plus demucs's uncompressed WAV output
        - name: tmp
          emptyDir:
            sizeLimit: 20Gi
        # Measured ~1.6GB for the Whisper "turbo" model, with headroom
        - name: models
          emptyDir:
            sizeLimit: 4Gi
        # Measured ~4.9GB across huggingface/torch/etc, with headroom
        - name: cache
          emptyDir:
            sizeLimit: 8Gi
{{- end }}