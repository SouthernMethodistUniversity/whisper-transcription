apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-frontend-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-frontend
  template:
    metadata:
      labels:
        app: whisper-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper-frontend
          image: "{{ .Values.frontend.image.name }}:{{ .Values.frontend.image.tag }}"
          env:
            - name: POD_NAMESPACE
              value: {{ .Values.namespace }}
            - name: HTTP_PROXY
              value: {{ .Values.backend.proxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.backend.proxy }}
            - name: NO_PROXY
              value: {{ .Values.backend.no_proxy }}
          resources:
            requests:
              cpu: "8"
              memory: "20Gi"
            limits:
              cpu: "12"
              memory: "50Gi"
          volumeMounts:
            - name: streamlit-secrets
              mountPath: /home/appuser/app/.streamlit/secrets.toml
              subPath: secrets.toml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: streamlit-config
              mountPath: /home/appuser/.streamlit
          ports:
            - containerPort: 8501
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: streamlit-secrets
          secret:
            secretName: streamlit-secrets
        # zip_it() bundles plain-text transcripts for download; up to 10
        # concurrent users is still a trivial footprint for text content
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        # app.py writes ~/.streamlit/config.toml at startup
        - name: streamlit-config
          emptyDir:
            sizeLimit: 50Mi
