name: scan-charts-and-images

# Report-only scanning: every scan exits 0 and results go to the Security tab.
# 1. Finds Helm charts (every Chart.yaml).
# 2. Finds images by rendering each chart, de-duplicated by name without tag.
# 3. Scans each image with Trivy and Grype in two complementary passes:
#      [FIXABLE] a patch exists -> bump the version
#      [NOFIX]   no patch       -> mitigate / compensate / accept-and-watch
# 4. Writes a prioritized Grype report per image to the job summary and keeps
#    the JSON as an artifact.
# Only host-kernel packages are suppressed (keep in sync: .trivy/*.rego,
# .grype.yaml, .grype/nofix.yaml).
#
# To reuse in another repo: copy this file, .github/scripts/, .trivy/,
# .grype.yaml and .grype/.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      chart_matrix: ${{ steps.find.outputs.chart_matrix }}
      has_charts: ${{ steps.find.outputs.has_charts }}
      image_matrix: ${{ steps.find.outputs.image_matrix }}
      has_images: ${{ steps.find.outputs.has_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0

      - name: Install yq (v4)
        shell: bash
        run: |
          set -euo pipefail
          YQ_VERSION="v4.54.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Find charts and images
        id: find
        shell: bash
        run: |
          set -euo pipefail

          trim() { sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d'; }

          # ---- charts ----
          CHART_DIRS=()
          while IFS= read -r d; do
            d="${d#./}"
            parent="$(dirname "$d")"
            # Skip vendored subcharts (<chart>/charts/<subchart>/Chart.yaml).
            if [ "$(basename "$parent")" = "charts" ] && [ -f "$(dirname "$parent")/Chart.yaml" ]; then
              continue
            fi
            CHART_DIRS+=("$d")
          done < <(find . -type f -name Chart.yaml -not -path '*/node_modules/*' -print | xargs -r -n1 dirname | sort -u)

          if [ ${#CHART_DIRS[@]} -eq 0 ]; then
            echo "No charts found."
            echo 'chart_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_charts=false' >> "$GITHUB_OUTPUT"
          else
            printf 'Charts:\n'; printf '  %s\n' "${CHART_DIRS[@]}"
            CHART_MATRIX=$(printf '%s\n' "${CHART_DIRS[@]}" | jq -R -s -c 'split("\n") | map(select(length>0)) | {include: map({chart: .})}')
            echo "chart_matrix=$CHART_MATRIX" >> "$GITHUB_OUTPUT"
            echo 'has_charts=true' >> "$GITHUB_OUTPUT"
          fi

          # ---- images ----
          : > images.txt

          for chart in "${CHART_DIRS[@]}"; do
            echo "Rendering chart: $chart"
            helm dependency build "$chart" || true
            if ! helm template chart "$chart" > rendered.yaml 2> helm.err; then
              echo "::warning::helm template failed for $chart, so its images were not discovered: $(head -c 300 helm.err | tr '\n' ' ')"
              continue
            fi
            # Any map with a containers/initContainers list, regardless of
            # workload kind (Deployment, StatefulSet, DaemonSet, Job, CronJob,
            # bare Pod, hook Jobs).
            yq -r '.. | select(tag == "!!map") | select(has("containers")) | .containers[].image' rendered.yaml >> images.txt
            yq -r '.. | select(tag == "!!map") | select(has("initContainers")) | .initContainers[].image' rendered.yaml >> images.txt
          done

          # De-duplicate by name WITHOUT tag/digest, because the Code Scanning
          # category is built from that name. Two tags of one image would
          # overwrite each other's results.
          trim < images.txt | grep -Ev '^(---|\.\.\.)$' | sort -u > images.all.txt || true
          : > images.unique.txt
          declare -A SEEN=()
          while IFS= read -r img; do
            case "$img" in
              *\$*) echo "::warning::Skipping image with an unresolved variable: $img"; continue ;;
            esac
            nodigest="${img%%@*}"
            if [[ "$img" != *@* && "${nodigest##*/}" != *:* ]]; then
              echo "::warning::Skipping image with no tag or digest (implicit :latest): $img"
              continue
            fi
            base="$nodigest"
            if [[ "${base##*/}" == *:* ]]; then base="${base%:*}"; fi
            if [[ -n "${SEEN[$base]:-}" ]]; then
              echo "::warning::Two versions of $base found. Scanning ${SEEN[$base]} and skipping $img, because both would share one Code Scanning category."
              continue
            fi
            SEEN[$base]="$img"
            echo "$img" >> images.unique.txt
          done < images.all.txt

          if [ ! -s images.unique.txt ]; then
            echo "No images found."
            echo 'image_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_images=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Discovered images:"
          cat images.unique.txt
          IMAGE_MATRIX=$(jq -R -s -c 'split("\n") | map(select(length>0)) | {include: map({image: .})}' < images.unique.txt)
          echo "image_matrix=$IMAGE_MATRIX" >> "$GITHUB_OUTPUT"
          echo 'has_images=true' >> "$GITHUB_OUTPUT"

  trivy-config-scan:
    needs: discover
    if: ${{ needs.discover.outputs.has_charts == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.chart_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0

      - name: Build Helm dependencies (if any)
        run: helm dependency build "${{ matrix.chart }}" || true

      - name: Set SARIF filename and category (config)
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SAFE_NAME=$(echo "${{ matrix.chart }}" | sed 's#[/ ]#-#g' | sed 's#^\.-##')
          if [ "$SAFE_NAME" = "." ]; then SAFE_NAME=root; fi
          echo "sarif_file=trivy-config-${SAFE_NAME}.sarif" >> "$GITHUB_OUTPUT"
          echo "category=trivy-config-${SAFE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_ACTION_DISABLE_STATUS: "true"
        with:
          scan-type: config
          scan-ref: ${{ matrix.chart }}
          format: sarif
          output: ${{ steps.names.outputs.sarif_file }}
          exit-code: "0"

      - name: Upload SARIF (config)
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: ${{ steps.names.outputs.sarif_file }}
          category: ${{ steps.names.outputs.category }}

  trivy-image-scan:
    needs: discover
    if: ${{ needs.discover.outputs.has_images == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.image_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Login to GHCR (safe even if images are public)
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # safe = full image ref incl. tag, used for file names only.
      # cat  = image name WITHOUT tag/digest, used for the SARIF category.
      #        Code Scanning keys its "Tools" entries on the category, so it
      #        must stay stable across version bumps; otherwise every new tag
      #        creates a new tool entry and the old one lingers with stale alerts.
      - name: Set safe image name and stable category
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SAFE_IMG=$(echo "${{ matrix.image }}" | sed 's#[/:@]#-#g')
          BASE="${{ matrix.image }}"
          BASE="${BASE%%@*}"
          if [[ "${BASE##*/}" == *:* ]]; then BASE="${BASE%:*}"; fi
          CAT_IMG=$(echo "$BASE" | sed 's#[/:@]#-#g')
          echo "safe=${SAFE_IMG}" >> "$GITHUB_OUTPUT"
          echo "cat=${CAT_IMG}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan (fixable)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_ACTION_DISABLE_STATUS: "true"
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          ignore-unfixed: true
          ignore-policy: ./.trivy/ignore-policy.rego
          format: sarif
          output: trivy-fixable-${{ steps.names.outputs.safe }}.sarif
          exit-code: "0"

      - name: Label SARIF (fixable)
        if: success() || failure()
        run: ./.github/scripts/tag-sarif.sh "trivy-fixable-${{ steps.names.outputs.safe }}.sarif" "[FIXABLE]"

      - name: Upload SARIF (fixable)
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-fixable-${{ steps.names.outputs.safe }}.sarif
          category: trivy-fixable-${{ steps.names.outputs.cat }}

      - name: Trivy image scan (no fix)
        if: success() || failure()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_ACTION_DISABLE_STATUS: "true"
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          ignore-policy: ./.trivy/ignore-policy-nofix.rego
          format: sarif
          output: trivy-nofix-${{ steps.names.outputs.safe }}.sarif
          exit-code: "0"

      - name: Label SARIF (no fix)
        if: success() || failure()
        run: ./.github/scripts/tag-sarif.sh "trivy-nofix-${{ steps.names.outputs.safe }}.sarif" "[NOFIX]"

      - name: Upload SARIF (no fix)
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-nofix-${{ steps.names.outputs.safe }}.sarif
          category: trivy-nofix-${{ steps.names.outputs.cat }}

  grype-image-scan:
    needs: discover
    if: ${{ needs.discover.outputs.has_images == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.image_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Login to GHCR (safe even if images are public)
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # safe = full image ref incl. tag, used for file names only.
      # cat  = image name WITHOUT tag/digest, used for the SARIF category.
      #        Code Scanning keys its "Tools" entries on the category, so it
      #        must stay stable across version bumps; otherwise every new tag
      #        creates a new tool entry and the old one lingers with stale alerts.
      - name: Set safe image name and stable category
        id: names
        shell: bash
        run: |
          set -euo pipefail
          SAFE_IMG=$(echo "${{ matrix.image }}" | sed 's#[/:@]#-#g')
          BASE="${{ matrix.image }}"
          BASE="${BASE%%@*}"
          if [[ "${BASE##*/}" == *:* ]]; then BASE="${BASE%:*}"; fi
          CAT_IMG=$(echo "$BASE" | sed 's#[/:@]#-#g')
          echo "safe=${SAFE_IMG}" >> "$GITHUB_OUTPUT"
          echo "cat=${CAT_IMG}" >> "$GITHUB_OUTPUT"

      # add-cpes-if-none: Go binaries often lack CPEs; without it Grype only
      # matches ecosystem advisories (same data as Trivy). by-cve reports CVE
      # IDs rather than GHSA IDs.
      - name: Grype image scan (fixable)
        uses: anchore/scan-action@v7.4.2
        with:
          image: ${{ matrix.image }}
          output-format: sarif
          output-file: grype-fixable-${{ steps.names.outputs.safe }}.sarif
          fail-build: false
          only-fixed: true
          add-cpes-if-none: true
          by-cve: true
          config: .grype.yaml

      - name: Label SARIF (fixable)
        if: success() || failure()
        run: ./.github/scripts/tag-sarif.sh "grype-fixable-${{ steps.names.outputs.safe }}.sarif" "[FIXABLE]"

      - name: Upload SARIF (fixable)
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: grype-fixable-${{ steps.names.outputs.safe }}.sarif
          category: grype-fixable-${{ steps.names.outputs.cat }}

      - name: Grype image scan (no fix)
        if: success() || failure()
        uses: anchore/scan-action@v7.4.2
        with:
          image: ${{ matrix.image }}
          output-format: sarif
          output-file: grype-nofix-${{ steps.names.outputs.safe }}.sarif
          fail-build: false
          add-cpes-if-none: true
          by-cve: true
          config: .grype/nofix.yaml

      - name: Label SARIF (no fix)
        if: success() || failure()
        run: ./.github/scripts/tag-sarif.sh "grype-nofix-${{ steps.names.outputs.safe }}.sarif" "[NOFIX]"

      - name: Upload SARIF (no fix)
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: grype-nofix-${{ steps.names.outputs.safe }}.sarif
          category: grype-nofix-${{ steps.names.outputs.cat }}

      # Prioritized report. SARIF carries no EPSS/KEV/risk data, so run Grype
      # once more in JSON (all findings, kernel packages excluded via
      # .grype.yaml, which sets no only-fixed) and render a per-CVE table in
      # the job summary. Report only: this step uploads nothing to code
      # scanning and changes no alerts. The JSON is kept as an artifact.
      - name: Grype image scan (prioritization report, JSON)
        id: grype_report
        if: success() || failure()
        uses: anchore/scan-action@v7.4.2
        with:
          image: ${{ matrix.image }}
          output-format: json
          output-file: grype-report-${{ steps.names.outputs.safe }}.json
          fail-build: false
          add-cpes-if-none: true
          by-cve: true
          config: .grype.yaml

      - name: Summarize report
        if: success() || failure()
        run: ./.github/scripts/grype-summary.sh "grype-report-${{ steps.names.outputs.safe }}.json" "${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep JSON report
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grype-report-${{ steps.names.outputs.safe }}
          path: grype-report-${{ steps.names.outputs.safe }}.json
          retention-days: 30
          if-no-files-found: warn
